name: Notify website

# The owai-website repo builds its Claude Skills Library page from a committed
# manifest, regenerated by its own `Sync Claude Skills` workflow. That workflow
# listens for a `skills-updated` repository_dispatch and otherwise falls back to
# a daily cron at 06:17 ET.
#
# Without this file a merged skill waits up to 24h to appear on the site. With
# it, the site is live in about five minutes.
#
# Requires repo secret WEBSITE_DISPATCH_TOKEN: a fine-grained PAT scoped to
# OneWave-AI/owai-website with Contents: read-write (the minimum that permits
# repository_dispatch). Nothing here reads the skills repo itself.

on:
  push:
    branches: [main]
    paths:
      - '*/SKILL.md'
      - '*/references/**'
      - '*/scripts/**'
      - '*/assets/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ping owai-website
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "::warning::WEBSITE_DISPATCH_TOKEN not set — the site will pick this up on its daily sync instead."
            exit 0
          fi
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/OneWave-AI/owai-website/dispatches \
            -d '{"event_type":"skills-updated"}')
          if [[ "$code" == "204" ]]; then
            echo "Dispatched skills-updated to owai-website."
          else
            echo "::error::dispatch failed (HTTP $code)"; cat /tmp/resp.txt; exit 1
          fi
